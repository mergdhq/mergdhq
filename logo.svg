<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="96" height="96">
  <title>Mergd</title>
  <!-- The app icon with the full stop's drop (same motion as src/components/DropMark.tsx): rests for 1.2s, then
       lifts off, falls, squashes on impact, bounces and settles. 3s loop. -->
  <style>
    .dot {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: drop 3s infinite;
    }
    @keyframes drop {
      0%, 40% { transform: translateY(0) scale(1); animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1); }
      58.3% { transform: translateY(-22px) scale(0.92, 1.08); animation-timing-function: cubic-bezier(0.32, 0, 0.67, 0); }
      75% { transform: translateY(0) scale(0.9, 1.1); animation-timing-function: ease-out; }
      76.3% { transform: translateY(0) scale(1.35, 0.65); }
      77.7% { transform: translateY(0) scale(1); animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1); }
      84.6% { transform: translateY(-4px) scale(1); animation-timing-function: cubic-bezier(0.32, 0, 0.67, 0); }
      91.6% { transform: translateY(0) scale(1.08, 0.92); }
      95.8% { transform: translateY(0) scale(0.97, 1.03); }
      100% { transform: translateY(0) scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .dot { animation: none; }
    }
  </style>
  <rect width="48" height="48" rx="12" fill="#0F1411" />
  <g transform="translate(24 24) scale(.72) translate(-24 -24)">
    <path d="M3.44 35V13.47H8.96V18.72L8.37 17.85Q8.84 15.37 10.65 14.18Q12.47 13 14.99 13Q17.67 13 19.7 14.36Q21.73 15.72 22.24 18.01L20.55 18.16Q21.61 15.52 23.58 14.26Q25.56 13 28.2 13Q30.52 13 32.32 14.03Q34.11 15.05 35.14 16.88Q36.16 18.72 36.16 21.16V35H30.25V22.42Q30.25 21.16 29.79 20.25Q29.34 19.35 28.51 18.84Q27.69 18.32 26.5 18.32Q25.36 18.32 24.51 18.84Q23.66 19.35 23.21 20.25Q22.76 21.16 22.76 22.42V35H16.84V22.42Q16.84 21.16 16.39 20.25Q15.94 19.35 15.11 18.84Q14.28 18.32 13.1 18.32Q11.95 18.32 11.11 18.84Q10.26 19.35 9.81 20.25Q9.35 21.16 9.35 22.42V35Z" fill="#fff" />
    <circle class="dot" cx="41.16" cy="31.6" r="3.4" fill="#3DD68C" />
  </g>
</svg>
